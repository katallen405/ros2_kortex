controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    robotiq_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    effort_controller:
      type: kortex_effort_controller/KortexEffortController

# Joint torques on /effort_controller/commands (Float64MultiArray, N*m, joints
# 1-7). NaN before the first command and once commands are older than
# cmd_timeout_sec: the hardware then puts the arm back in position hold.
# Exclusive with joint_trajectory_controller -- switch between them. Torque
# mode has no gravity compensation; the publisher must supply it.
effort_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    cmd_timeout_sec: 0.2
    cmd_stale_warn_sec: 0.05

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true
